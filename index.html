<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>History Globe</title>
    <meta name="description" content="Pick a date and see the world's borders at that moment in history." />
  </head>
  <body>
    <div id="map"></div>

    <header class="topbar">
      <h1>History Globe</h1>
      <button id="about-btn" class="ghost" aria-label="About and sources">About</button>
    </header>

    <aside id="panel" class="panel" hidden>
      <button id="panel-close" class="ghost close" aria-label="Close">✕</button>
      <div id="panel-body"></div>
    </aside>

    <footer class="timebar">
      <div class="row">
        <button id="prev" aria-label="Back one step">‹</button>
        <form id="date-form">
          <input id="date-input" aria-label="Date" autocomplete="off" spellcheck="false" />
        </form>
        <button id="next" aria-label="Forward one step">›</button>
      </div>
      <input id="slider" type="range" aria-label="Timeline" />
      <div class="row small">
        <span>3000 BC</span>
        <span id="precision"></span>
        <span>Today</span>
      </div>
    </footer>

    <dialog id="about"></dialog>
    <div id="toast" role="status" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
