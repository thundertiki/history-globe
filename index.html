<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>History Globe</title>
    <link rel="icon" href="./icons/favicon-32.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b1320" />
    <meta name="description" content="Pick a date and see the world's borders at that moment in history." />
  </head>
  <body>
    <div id="map"></div>

    <header class="topbar">
      <h1>History Globe</h1>
      <div class="top-actions">
        <button id="search-btn" class="ghost" aria-haspopup="true" aria-expanded="false" aria-label="Search for a country or empire">Search</button>
        <button id="layers-btn" class="ghost" aria-haspopup="true" aria-expanded="false">Layers</button>
        <button id="share-btn" class="ghost" aria-label="Share a link to this view">Share</button>
        <button id="about-btn" class="ghost" aria-label="About and sources">About</button>
      </div>
      <div id="search" class="layers searchbox" hidden>
        <input id="search-input" type="search" placeholder="Find a country or empire…" aria-label="Search by name" autocomplete="off" spellcheck="false" />
        <ul id="search-results" role="listbox"></ul>
      </div>
      <div id="layers" class="layers" hidden>
        <label><input type="checkbox" id="layer-events" checked /> <span class="dot ev"></span> Battles, treaties and cities</label>
        <label><input type="checkbox" id="layer-human" checked /> <span class="dot hu"></span> Early humans (before AD 1500)</label>
      </div>
    </header>

    <aside id="panel" class="panel" hidden>
      <button id="panel-close" class="ghost close" aria-label="Close">✕</button>
      <div id="panel-body"></div>
    </aside>

    <footer class="timebar">
      <div class="row">
        <button id="play" aria-label="Play through time" title="Play through time">▶</button>
        <button id="prev" aria-label="Back one step">‹</button>
        <form id="date-form">
          <input id="date-input" aria-label="Date" autocomplete="off" spellcheck="false" />
        </form>
        <button id="next" aria-label="Forward one step">›</button>
        <button id="next-change" class="hi" aria-label="Next change" title="Jump to the next date the borders change"><span class="lbl">Next </span>▸</button>
      </div>
      <div id="eras" class="eras" role="tablist" aria-label="Era"></div>
      <input id="slider" type="range" aria-label="Timeline" />
      <div class="row small">
        <span>300,000 BC</span>
        <span id="precision"></span>
        <span>Today</span>
      </div>
    </footer>

    <dialog id="about"></dialog>
    <div id="toast" role="status" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
